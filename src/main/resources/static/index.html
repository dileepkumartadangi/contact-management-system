<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <header>
        <h1>Contact Management System</h1>
        <p>Manage your contacts easily</p>
    </header>

    <!-- Contact Form -->
    <section class="form-section">

        <h2 id="formTitle">Add New Contact</h2>

        <form id="contactForm">

            <input
                    type="text"
                    id="name"
                    placeholder="Enter Name"
                    required
            >

            <input
                    type="email"
                    id="email"
                    placeholder="Enter Email"
                    required
            >

            <input
                    type="tel"
                    id="phone"
                    placeholder="Enter Phone Number"
                    required
            >

            <button type="submit" id="submitButton">
                Add Contact
            </button>

            <button type="button" id="cancelButton" hidden>
                Cancel Edit
            </button>

        </form>

    </section>

    <!-- Search Section -->
    <section class="search-section">

        <h2>Search Contacts</h2>

        <input
                type="text"
                id="searchInput"
                placeholder="Search by name"
        >

        <button type="button" id="searchButton">
            Search
        </button>

        <button type="button" id="showAllButton">
            Show All
        </button>

    </section>

    <!-- Contact List -->
    <section class="contacts-section">

        <h2>Contact List</h2>

        <p id="message"></p>

        <div class="table-container">

            <table>

                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody id="contactTableBody">
                </tbody>

            </table>

        </div>

    </section>

</div>

<script src="script.js"></script>

</body>
</html>
